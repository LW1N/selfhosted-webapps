apiVersion: apps/v1
kind: Deployment
metadata:
  name: temp-home
  namespace: uncannydev-home
  labels:
    app: temp-home
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temp-home
  template:
    metadata:
      labels:
        app: temp-home
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site-content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: site-content
          configMap:
            name: temp-home-content
            items:
              - key: index.html
                path: index.html
        - name: nginx-config
          configMap:
            name: temp-home-content
            items:
              - key: default.conf
                path: default.conf
