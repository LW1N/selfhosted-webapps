apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  # Match the manually installed release, including its Helm history namespace.
  releaseName: prometheus
  targetNamespace: monitoring
  storageNamespace: monitoring
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "92.10.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h
  # The existing release was installed with chart defaults only.
  # Grafana's chart reuses its existing admin-password Secret during upgrades.
  values: {}
