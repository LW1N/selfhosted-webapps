apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  # Match the manually installed release, including its Helm history namespace.
  releaseName: prometheus
  targetNamespace: monitoring
  storageNamespace: monitoring
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "92.10.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h
  # Grafana's chart reuses its existing admin-password Secret during upgrades.
  values:
    grafana:
      persistence:
        enabled: true
        storageClassName: local-path
        accessModes: [ReadWriteOnce]
        size: 5Gi
    prometheus:
      prometheusSpec:
        retention: 10d
        retentionSize: 16GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 20Gi
    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 1Gi
