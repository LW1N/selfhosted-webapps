apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-scripts
  namespace: demo
data:
  init-user.sql: |
    -- Runs on first initialization only (when /var/lib/mysql is empty).
    -- The user is created automatically by MySQL from MYSQL_USER / MYSQL_PASSWORD
    -- env vars. This script ensures remote access from any pod in the cluster.
    CREATE DATABASE IF NOT EXISTS `demo` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    USE `demo`;

    GRANT ALL PRIVILEGES ON `demo`.* TO 'demo'@'%';

    CREATE TABLE IF NOT EXISTS `users` (
      `id` INT AUTO_INCREMENT PRIMARY KEY,
      `first_name` VARCHAR(80) NOT NULL,
      `last_name` VARCHAR(80) NOT NULL,
      `email` VARCHAR(191) NOT NULL UNIQUE,
      `home_address` VARCHAR(255) NOT NULL,
      `home_phone` VARCHAR(32) NOT NULL,
      `cell_phone` VARCHAR(32) NOT NULL,
      `created_at` DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
      `updated_at` DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
      INDEX `idx_users_name` (`last_name`, `first_name`),
      INDEX `idx_users_email` (`email`),
      INDEX `idx_users_home_phone` (`home_phone`),
      INDEX `idx_users_cell_phone` (`cell_phone`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

    CREATE TABLE IF NOT EXISTS `product_visit_counts` (
      `slug` VARCHAR(120) PRIMARY KEY,
      `visit_count` INT UNSIGNED NOT NULL DEFAULT 0,
      `created_at` DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
      `updated_at` DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
      INDEX `idx_product_visit_counts_visit_count` (`visit_count`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

