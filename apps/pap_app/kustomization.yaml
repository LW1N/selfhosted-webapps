apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

images:
  - name: docker.io/lw1n/pap_app
    newTag: sha-79ee159

resources:
  - k8s/namespace.yaml
  # secret.yaml is NOT in Git (security). Create it manually:
  #   kubectl create secret generic mysql-secret --namespace=demo \
  #     --from-literal=MYSQL_ROOT_PASSWORD='...' \
  #     --from-literal=MYSQL_DATABASE='demo' \
  #     --from-literal=MYSQL_USER='demo' \
  #     --from-literal=MYSQL_PASSWORD='...' \
  #     --from-literal=ADMIN_PASSWORD_HASH='...' \
  #     --from-literal=STANDARD_USERS_JSON='{"user":"<password-hash>"}'
  # See k8s/secret.yaml.example for the template.
  - k8s/mysql-init-configmap.yaml
  - k8s/mysql-pvc.yaml
  - k8s/mysql-deployment.yaml
  - k8s/mysql-service.yaml
  - k8s/web-deployment.yaml
  - k8s/web-service.yaml
  - k8s/ingress.yaml
  # Uncomment the next line if you need a private-registry pull secret:
  # - k8s/ghcr-pull-secret.yaml
