apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-scripts
  namespace: demo
data:
  init-user.sql: |
    -- Runs on first initialization only (when /var/lib/mysql is empty).
    -- The user is created automatically by MySQL from MYSQL_USER / MYSQL_PASSWORD
    -- env vars. This script ensures remote access from any pod in the cluster.
    GRANT ALL PRIVILEGES ON `demo`.* TO 'demo'@'%';
    FLUSH PRIVILEGES;
