    <style>
        *, *::before, *::after { box-sizing: border-box; }

            color: #1a1a1a; background: #f5f5f5;
        }
        h1 { margin-bottom: .25rem; }

        nav { margin-bottom: 1.5rem; font-size: .9rem; }

    <div class="card">
        <h2>Web Server <span class="badge">OK</span></h2>
        <p>Apache + PHP is serving requests on port 80.</p>
    </div>

    <div class="card">
        <h2>Database <span class="badge">OK</span></h2>
        <p>MySQL backend connected via internal cluster DNS.</p>
