apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: uncannydev-home
  namespace: flux-system
spec:
  interval: 1m
  path: ./apps/uncannydev-home
  prune: true
  dependsOn:
    - name: pap-app
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: uncannydev-home
  wait: true
  timeout: 3m
